<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Map of the Americas">
  <defs>
    <linearGradient id="americasLand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#EEF2FF"/>
  <g fill="url(#americasLand)">
    <!-- North America: Alaska and Canada across the top, tapering through
         Mexico to the Central American isthmus. -->
    <path d="M7 14 L15 9 L26 8 L36 11 L39 16 L33 19 L29 23 L26 27 L24 31 L21 30 L18 26 L13 22 L9 19 Z"/>
    <!-- Florida -->
    <path d="M26 26 L28 25 L27 30 L25 30 Z"/>
    <!-- Central America -->
    <path d="M22 32 L26 35 L29 38 L27 40 L23 37 L20 34 Z"/>
    <!-- South America: the north coast, the Brazilian bulge and the long
         Andean taper down to Patagonia. -->
    <path d="M28 40 L35 41 L39 45 L38 51 L34 56 L31 61 L28 60 L27 54 L25 47 L25 43 Z"/>
    <!-- Caribbean -->
    <circle cx="31" cy="33" r="1.1"/>
    <circle cx="34" cy="34" r="0.9"/>
  </g>
</svg>
