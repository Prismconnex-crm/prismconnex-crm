<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Map of Europe">
  <defs>
    <linearGradient id="europeLand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#EEF2FF"/>
  <g fill="url(#europeLand)">
    <!-- The mainland as one mass: the Atlantic coast, across to the Russian
         plain, back along the Mediterranean and down into Iberia. -->
    <path d="M16 33 L22 29 L30 27 L38 27 L48 28 L56 31 L55 38 L47 42 L40 44 L34 43 L28 41 L24 41 L23 46 L18 50 L12 47 L12 41 L17 39 Z"/>
    <!-- The Scandinavian peninsula -->
    <path d="M41 27 L40 14 L45 8 L50 13 L49 22 L46 28 Z"/>
    <!-- Great Britain and Ireland -->
    <path d="M14 26 L19 24 L20 31 L16 34 L13 31 Z"/>
    <path d="M9 30 L12 29 L12 34 L9 33 Z"/>
    <!-- Italy, with Sicily off the toe -->
    <path d="M32 42 L36 43 L38 51 L35 54 L33 48 Z"/>
    <circle cx="33" cy="56" r="1.3"/>
    <!-- Greece and the Aegean -->
    <path d="M40 45 L45 46 L43 51 L40 50 Z"/>
  </g>
</svg>
