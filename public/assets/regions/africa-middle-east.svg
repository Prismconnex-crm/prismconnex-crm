<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Map of Africa and the Middle East">
  <defs>
    <linearGradient id="africaLand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#EEF2FF"/>
  <g fill="url(#africaLand)">
