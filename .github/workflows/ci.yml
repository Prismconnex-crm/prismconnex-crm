name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          
      - run: npm install
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # The Playwright suite in tests/e2e is still a draft: @playwright/test is
      # not a dependency, there is no playwright.config.ts (no baseURL/webServer),
      # and the flow depends on live Supabase email verification. Re-enable this
      # step once that suite is actually runnable.
      # - run: npx playwright test tests/e2e
